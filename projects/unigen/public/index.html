<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Unigen App</title>
    <style>
        /* 🎨 [ЦЕНТРАЛИЗОВАННЫЙ СЛОЙ СТИЛЕЙ UNIGEN PANEL] */
        body { 
            margin: 0; 
            background: #fafafa; 
            font-family: sans-serif; 
        }

        /* 📋 Стили архитектуры многоуровневых табов */
        .unigen-tabs {
            display: inline-flex;
            gap: 0px;
        }
        .unigen-tab-btn {
            padding: 8px 16px;
            font-size: 12px;
            font-weight: bold;
            background: #ddd;
            border: 4px ridge #000;
            color: #000;
            transition: 0.2s;
        }
        .unigen-tab-btn:hover { background: #bbb; }
        .unigen-tab-btn.active {
            background: #0a0;
            color: white;
        }
        .unigen-tab-content {
            display: none;
            gap: 10px;
            flex-wrap: wrap;
            border: 4px ridge #000;
            margin: 0px 0 15px;
            min-height: 200px;
        }
        .unigen-tab-content.active { display: flex; }

        /* 🗂️ Карточки подкатегорий внутри табов */
        .unigen-card {
            padding: 20px 10px 10px;
            border-radius: 4px;
            min-width: 260px;
            flex: 1;
        }
        .unigen-card__title {
            color: #000;
            display: block;
            margin-bottom: 5px;
            font-size: 16px;
            text-align: center;
        }
        .unigen-card__subtitle {
            display: block;
            font-size: 16px;
            font-weight: bold;
            margin: 5px 0 15px;
            color: #555;
            border: 4px ridge transparent;
            border-bottom: 4px ridge #000;
            padding-bottom: 10px;
            text-align: center;
        }
        .unigen-prompt-link {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            color: #333;
            padding: 4px 2px;
            font-size: 16px;
        }
        .unigen-prompt-link:hover { background: #f0f0f0; }
        /* 🕹️ Управляющие триггеры пульта */
        .unigen-actions-row {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-top: 10px;
        }
        .unigen-btn-group {
            display: flex; 
            gap: 8px;
        }
        .unigen-btn {
            padding: 10px 24px;
            font-size: 13px;
            color: white;
            border: none;
            border-radius: 100px;
            font-weight: bold;
            transition: 0.2s;
        }
        .unigen-btn--success { background: #0a0; }
        .unigen-btn--success:hover { background: #080; }
        .unigen-btn--success:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .unigen-btn--danger { background: #dc3545; }
        .unigen-btn--danger:hover { background: #c82333; }
        
        .unigen-btn--secondary { background: #ddd; color: #000; }
        .unigen-btn--secondary:hover { background: #bbb; }

        /* 🔬 Системные счётчики в окне трассировки логов */
        .terminalOutput {
            padding: 15px;
            counter-reset: prompt;
            background: #1e1e1e;
            color: #0e0;
            border-radius: 4px;
            height: calc(100vh - 150px);
            overflow-y: auto;
            font-family: monospace;
            font-size: 16px;
            margin: 0;
            box-sizing: border-box;
            line-height: 1.5;
        }
        .terminalOutput__h1{
            color: #fff;
            border-bottom: 4px ridge #fff;
            padding: 13px 0px 0px;
            position: relative;
            z-index: 5;
        }
        .terminalOutput__h1:before {
            content: "ЗАПРОС № " counter(prompt);
            counter-increment: prompt;
            font-size: 20px;
            position: absolute;
            top: 0;
            left: 0;
            margin: auto;
            display: block;
            height: 37px;
            background: #1e1e1e;
            padding: 0 15px 0px 0;
        }
        .terminalOutput__h2 {
            text-align: center;
            position: relative;
        }

        .terminalOutput__h2:before {
            content: '';
            position: absolute;
            top: 30px;
            bottom:0;
            left: 0;
            right: 0;
            z-index: 5;
            margin: auto;
            display:block;
            height:0;
            width: 200px;
            border:4px ridge transparent;
            border-bottom: 4px ridge #fff;
        }
        .terminalOutput__h2-txt{
            position:relative;
            z-index:6;
            color: #fff;
            display:inline-block;
            padding:0 9px 0 10px;
            font-size: 20px;
        }

        .terminalOutput__prompt-txt {
            color:#fff
        }

        /* 🚀 Селекторы полного исключения inline-CSS */
        .unigen-panel-container {
            padding: 2rem;
            min-height: 100vh;
            background: #fafafa;
            box-sizing: border-box;
        }
        .unigen-panel-subtitle {
            color: #666; 
            margin-top: -10px;
        }
        .unigen-panel-section-title {
            margin-bottom: 8px; 
            color: #333;
        }
        .unigen-input-zone {
            margin-top: 20px;
        }
        .unigen-textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            border-radius: 4px;
            border: 4px ridge #000;
            font-size: 16px;
            font-family: sans-serif;
            box-sizing: border-box;
            resize: vertical;
        }
        .unigen-output-zone {
            margin-top: 25px;
        }
    </style>
    <link rel="stylesheet" href="/style.css"></head>
<body>
    <div id="root"></div>
    <!-- Подключаем самомонтирующийся компонент напрямую -->
    <script type="module" src="/lib/src/frontend/components/App.js"></script>
</body>
</html>
